name: Update formula on CLI release

on:
  repository_dispatch:
    types: [cli-released, enable-cli-released, rightdocuments-cli-released, rightimaged-cli-released, rightdesk-cli-released, rightrank-cli-released]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Determine formula details
        id: meta
        run: |
          EVENT="${{ github.event.action }}"
          case "$EVENT" in
            enable-cli-released)
              # enable-cli is private: its release job uploads the binaries to this
              # public repo, under enbl-v<version>.
              echo "repo=aluminumio/homebrew-tap" >> $GITHUB_OUTPUT
              echo "tag_prefix=enbl-v" >> $GITHUB_OUTPUT
              echo "formula=Formula/enbl.rb" >> $GITHUB_OUTPUT
              echo "name=enbl" >> $GITHUB_OUTPUT
              echo "artifacts=enbl-darwin-arm64 enbl-bar-darwin-arm64 enbl-linux-amd64" >> $GITHUB_OUTPUT
              ;;
            rightdocuments-cli-released)
              echo "repo=aluminumio/rightdocuments-cli" >> $GITHUB_OUTPUT
              echo "formula=Formula/rightdocuments.rb" >> $GITHUB_OUTPUT
              echo "name=rightdocuments" >> $GITHUB_OUTPUT
              echo "artifacts=rightdocuments-darwin-arm64 rightdocuments-linux-x86_64" >> $GITHUB_OUTPUT
              ;;
            rightimaged-cli-released)
              echo "repo=aluminumio/rightimaged-cli" >> $GITHUB_OUTPUT
              echo "formula=Formula/rightimaged.rb" >> $GITHUB_OUTPUT
              echo "name=rightimaged" >> $GITHUB_OUTPUT
              echo "artifacts=rightimaged-darwin-arm64 rightimaged-linux-amd64" >> $GITHUB_OUTPUT
              ;;
            rightdesk-cli-released)
              echo "repo=aluminumio/rightdesk-cli" >> $GITHUB_OUTPUT
              echo "formula=Formula/rightdesk.rb" >> $GITHUB_OUTPUT
              echo "name=rightdesk" >> $GITHUB_OUTPUT
              echo "artifacts=rd-darwin-arm64 rd-linux-x86_64" >> $GITHUB_OUTPUT
              ;;
            rightrank-cli-released)
              echo "repo=aluminumio/rightrank-cli" >> $GITHUB_OUTPUT
              echo "formula=Formula/rightrank-cli.rb" >> $GITHUB_OUTPUT
              echo "name=rightrank-cli" >> $GITHUB_OUTPUT
              echo "artifacts=rightrank-darwin-arm64 rightrank-linux-amd64" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "repo=aluminumio/rightsignals-cli" >> $GITHUB_OUTPUT
              echo "formula=Formula/rightsignals.rb" >> $GITHUB_OUTPUT
              echo "name=rightsignals" >> $GITHUB_OUTPUT
              echo "artifacts=rightsignals-darwin-arm64 rightsignals-linux-amd64" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Download release artifacts and update formula
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
          VERSION: ${{ github.event.client_payload.version }}
          REPO: ${{ steps.meta.outputs.repo }}
          FORMULA: ${{ steps.meta.outputs.formula }}
          ARTIFACTS: ${{ steps.meta.outputs.artifacts }}
          TAG_PREFIX: ${{ steps.meta.outputs.tag_prefix || 'v' }}
        run: |
          TAG="${TAG_PREFIX}${VERSION}"
          for artifact in $ARTIFACTS; do
            url="https://github.com/${REPO}/releases/download/${TAG}/${artifact}"
            curl -fsSL "$url" -o "/tmp/${artifact}"
            sha=$(sha256sum "/tmp/${artifact}" | awk '{print $1}')
            sed -i "/${artifact}/{ n; s/sha256 \".*\"/sha256 \"${sha}\"/; }" "$FORMULA"
          done
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$FORMULA"
          sed -i "s|github.com/[^/]*/[^/]*/releases/download/[^/]*/|github.com/${REPO}/releases/download/${TAG}/|g" "$FORMULA"

      - name: Commit and push
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update ${NAME} to v${VERSION}" || exit 0
          git push
